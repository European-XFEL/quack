[build-system]
requires = ["setuptools", "wheel", "setuptools_scm>=8"]
build-backend = "setuptools.build_meta"

[project]
name = "quack"
authors = [
    {name = "Danilo Enoque Ferreira de Lima", email = "danilo.enoque.ferreira.de.lima@xfel.eu"},
    {name = "Tim Berberich", email = "tim.berberich@xfel.eu"},
    ]
dynamic=["version"]
description = "Reconstruct FEL time and energy spectrogram from angular streaking experiments."
requires-python = ">=3.7"
keywords = ["angular streaking", "strong field approximation", "quantum mechanics"]
classifiers = [
          "Development Status :: 3 - Alpha",
          "Environment :: Console",
          "Intended Audience :: Developers",
          "Intended Audience :: Science/Research",
          "Operating System :: POSIX :: Linux",
          "Programming Language :: Python :: 3",
          "Programming Language :: Python :: 3.7",
          "Topic :: Scientific/Engineering :: Information Analysis",
          "Topic :: Scientific/Engineering :: Physics"
          ]
dependencies = [
          "numpy",
          "scipy>1.6",
          "h5py",
          "matplotlib",
          "juliacall",
          ]
[project.optional-dependencies]
torch = ["torch"]

[tool.setuptools]
packages = ["quack"]
include-package-data = true
zip-safe = false

[tool.setuptools-git-versioning]
enabled = true
[tool.setuptools_scm]
version_file = "quack/_version.py"

#[tool.setuptools.package-dir]
#quack = ""

#[tool.setuptools.package-data]
#quack = ["quack/*"]


